#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

general {
    gaps_in = 0
    gaps_out = 0

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgb(3a3a4a) rgb(5a5a7a) 45deg
    col.inactive_border = rgb(000000)
    col.nogroup_border = rgb(ffffff)
    col.nogroup_border_active = rgb(ffffff)
    border_size = 1

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 3

    # Change transparency of focused and unfocused windows
    active_opacity = 0.95
    inactive_opacity = 0.9
    fullscreen_opacity = 1

    shadow {
        enabled = true
        range = 4
        render_power = 2
        color = rgba(0, 0, 0, 0.4)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 5
        passes = 3
        ignore_opacity = true
        popups = true
    }

}

# Layer rules (must be at top level, not inside decoration block)
layerrule = blur off, match:namespace selection
layerrule = blur on, animation slide right, match:namespace waybar
layerrule = blur on, match:namespace logout_dialog
layerrule = blur on, ignore_alpha 0.2, animation slide down, match:namespace notifications
layerrule = blur on, animation slide left, dim_around on, match:namespace rofi

animations {
    enabled = true

    # Bezier curves
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = easeInOutSine, 0.37, 0, 0.63, 1
    bezier = smooth, 0.25, 0.1, 0.25, 1.0

    # Main window animations – use slidevert instead of slide
    animation = windows, 1, 4, smooth, slidevert
    animation = windowsMove, 1, 4, smooth, slidevert

    animation = windowsIn, 1, 3, smooth, slide
    animation = windowsOut, 1, 3, smooth, slide

    # Workspace switches – make them vertical
    animation = workspaces, 1, 3, smooth, slidevert

    # Special workspaces also vertical
    animation = specialWorkspaceIn, 1, 3, smooth, slidevert
    animation = specialWorkspaceOut, 1, 3, smooth, slidevert

    animation = border, 1, 8, smooth
    animation = borderangle, 1, 20, easeInOutSine, loop

    animation = layersIn, 1, 3, smooth, fade
    animation = layersOut, 1, 3, smooth, fade
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    force_split = 0
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # 0 or 1 disables the anime mascot wallpapers
    disable_hyprland_logo = true # Disables the random hyprland logo / anime girl background.
}
