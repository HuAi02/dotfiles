# Hours
label {
    monitor =
    text = cmd[update:60000] echo "<b><big> $(date +"%H") </big></b>"
    font_size = 100
    font_family = Adwaita
    shadow_passes = 4
    shadow_size = 6
    position = 0, 100
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:60000] echo "<b><big> $(date +"%M") </big></b>"
    font_size = 100
    font_family = Adwaita
    shadow_passes = 4
    shadow_size = 6
    position = 0, -20
    halign = center
    valign = center
}

# Day of week
label {
    monitor =
    text = cmd[update:18000000] echo "$(date +'%A')"
    font_size = 22
    font_family = Adwaita
    shadow_passes = 2
    shadow_size = 3
    position = 0, -110
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:18000000] echo "$(date +'%d %B %Y')"
    font_size = 16
    font_family = Adwaita
    shadow_passes = 2
    shadow_size = 3
    position = 0, -140
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = cmd[update:3600000] echo "Hey, $(whoami)"
    font_size = 18
    font_family = Adwaita
    shadow_passes = 2
    shadow_size = 2
    position = 0, 220
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 240, 44
    outline_thickness = 1
    dots_size = 0.24
    dots_spacing = 0.5
    dots_center = true
    rounding = 14
    outer_color = rgba(255, 255, 255, 0.06)
    inner_color = rgba(255, 255, 255, 0.06)
    font_color = rgba(255, 255, 255, 0.8)
    check_color = rgba(52, 211, 153, 0.6)
    fail_color = rgba(239, 68, 68, 0.6)
    fade_on_empty = true
    placeholder_text = <i>Unlock</i>
    position = 0, -210
    halign = center
    valign = center
    invert_numlock = true
}

# Now Playing
label {
    monitor =
    text = cmd[update:5000] bash ~/dotfiles/scripts/now_playing.sh
    font_size = 14
    font_family = Adwaita
    shadow_passes = 2
    shadow_size = 2
    position = 0, 80
    halign = center
    valign = bottom
}
