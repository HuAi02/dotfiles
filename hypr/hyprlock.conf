background {
    monitor =
    path = /home/huai/Pictures/Wallpapers/wallpaper.jpg
    blur_size = 8
    blur_passes = 0
    noise = 0.01
    contrast = 1.1
    brightness = 0.8
    vibrancy = 0.3
    vibrancy_darkness = 0.2
}

animations {
    bezier = ease, 0.42, 0, 1, 1
    animation = fadeIn, 1, 5, ease
}

general {
    immediate_render = false
}

